<html lang="en">
<head>
  <meta charset="UTF-8">

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;

    .grocery-item label {

      font-size: 0.95rem;

    .grocery-item.checked label {
      text-decoration: line-through;

    }
    .store-badge {

    }
    button.action-btn {

      max-width: 320px;

<script>
// ==========================================
// 1. SIMPLE HOUSEHOLD PASSWORD PROTECTION
// ==========================================
// Change this string to whatever family password you prefer:
const APP_PASSWORD = "swim2026";

function checkAuth() {
  const isAuth = localStorage.getItem('wongler_auth_verified');
  if (isAuth === 'true') {
    document.getElementById('lockOverlay').style.display = 'none';
    document.getElementById('appContainer').style.display = 'block';
  } else {
    document.getElementById('lockOverlay').style.display = 'flex';
    document.getElementById('appContainer').style.display = 'none';
  }
}

document.getElementById('unlockBtn').addEventListener('click', handleUnlock);
document.getElementById('passInput').addEventListener('keyup', (e) => {
  if (e.key === 'Enter') handleUnlock();
});

function handleUnlock() {
  const val = document.getElementById('passInput').value;
  if (val === APP_PASSWORD) {
    localStorage.setItem('wongler_auth_verified', 'true');
    document.getElementById('lockOverlay').style.display = 'none';
    document.getElementById('appContainer').style.display = 'block';
  } else {
    document.getElementById('lockError').style.display = 'block';
  }
}

// ==========================================
// 2. FIREBASE CONFIGURATION
// ==========================================
// Paste your exact keys from the Firebase console here:
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "wongler-meal-planning.firebaseapp.com",
  projectId: "wongler-meal-planning",
  storageBucket: "wongler-meal-planning.appspot.com",
  messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
  appId: "YOUR_APP_ID"
};

let db = null;
let planDocRef = null;
try {
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  planDocRef = db.collection('mealPlanner').doc('currentWeek');
} catch (e) {
  console.warn("Firebase not configured yet.", e);
}

// ==========================================
// 3. CSV PARSING & STATE
// ==========================================
function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  if (lines.length === 0) return [];
  const headers = parseCSVLine(lines[0]);
  const rows = [];
  for (let i = 1; i < lines.length; i++) {
    if (!lines[i].trim()) continue;
    const values = parseCSVLine(lines[i]);
    const obj = {};
    headers.forEach((h, idx) => {
      obj[h.trim()] = values[idx] ? values[idx].trim() : '';
    });
    rows.push(obj);
  }
  return rows;
}

function parseCSVLine(line) {
  const result = [];
  let current = '';
  let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const char = line[i];
    if (char === '"') {
      if (inQuotes && line[i + 1] === '"') {
        current += '"';
        i++;
      } else {
        inQuotes = !inQuotes;
      }
    } else if (char === ',' && !inQuotes) {
      result.push(current);
      current = '';
    } else {
      current += char;
    }
  }
  result.push(current);
  return result;
}

const DAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];
let mealsData = [];
let ingredientsMap = {};
let selections = {};
let checkedItems = {};
let customItems = []; // Array of { id, name, stores: [] }

function initData() {
  const mealsRaw = document.getElementById('mealsCsvData').textContent;
  mealsData = parseCSV(mealsRaw);

  const ingRaw = document.getElementById('ingredientsCsvData').textContent;
  const ingRows = parseCSV(ingRaw);
  const storeCols = ["Harris Teeter", "Trader Joe's", "Sam's Club", "Costco", "Wegmans", "Amazon"];

  ingRows.forEach(row => {
    const rawName = row['ingredient'];
    if (!rawName) return;
    const normalizedKey = rawName.trim().toLowerCase();
    
    ingredientsMap[normalizedKey] = {
      displayName: rawName.trim(),
      stores: []
    };

    storeCols.forEach(store => {
      const val = (row[store] || '').toUpperCase();
      if (val === 'TRUE' || val === 'YES' || val === 'X' || val === '1') {
        ingredientsMap[normalizedKey].stores.push(store);
      }
    });
  });
}

function renderDays() {
  const container = document.getElementById('weekContainer');
  container.innerHTML = '';

  const categories = {};
  mealsData.forEach(meal => {
    if (!categories[meal.category]) categories[meal.category] = [];
    categories[meal.category].push(meal);
  });

  DAYS.forEach(day => {
    const card = document.createElement('div');
    card.className = 'day-card';
    card.innerHTML = `<h3>${day}</h3>`;

    const lunchField = document.createElement('div');
    lunchField.className = 'meal-field';
    lunchField.innerHTML = `<label for="${day}_lunch">Lunch</label>`;
    const lunchSelect = document.createElement('select');
    lunchSelect.id = `${day}_lunch`;
    lunchSelect.innerHTML = `<option value="">-- None / Leftovers --</option>`;

    const dinnerField = document.createElement('div');
    dinnerField.className = 'meal-field';
    dinnerField.innerHTML = `<label for="${day}_dinner">Dinner</label>`;
    const dinnerSelect = document.createElement('select');
    dinnerSelect.id = `${day}_dinner`;
    dinnerSelect.innerHTML = `<option value="">-- None / Dine Out --</option>`;

    Object.keys(categories).forEach(cat => {
      const optGroupL = document.createElement('optgroup');
      optGroupL.label = cat;
      const optGroupD = document.createElement('optgroup');
      optGroupD.label = cat;

      categories[cat].forEach(m => {
        optGroupL.appendChild(new Option(m.meal_name, m.meal_id));
        optGroupD.appendChild(new Option(m.meal_name, m.meal_id));
      });

      lunchSelect.appendChild(optGroupL);
      dinnerSelect.appendChild(optGroupD);
    });

    if (selections[`${day}_lunch`]) lunchSelect.value = selections[`${day}_lunch`];
    if (selections[`${day}_dinner`]) dinnerSelect.value = selections[`${day}_dinner`];

    lunchSelect.addEventListener('change', e => onMealChange(`${day}_lunch`, e.target.value));
    dinnerSelect.addEventListener('change', e => onMealChange(`${day}_dinner`, e.target.value));

    lunchField.appendChild(lunchSelect);
    dinnerField.appendChild(dinnerSelect);
    card.appendChild(lunchField);
    card.appendChild(dinnerField);
    container.appendChild(card);
  });
}

// ==========================================
// 4. CLOUD SYNC & REALTIME LISTENER
// ==========================================
function syncToCloud() {
  if (!planDocRef) {
    localStorage.setItem('wongler_meal_selections', JSON.stringify(selections));
    localStorage.setItem('wongler_checked_items', JSON.stringify(checkedItems));
    localStorage.setItem('wongler_custom_items', JSON.stringify(customItems));
    return;
  }
  planDocRef.set({
    selections: selections,
    checkedItems: checkedItems,
    customItems: customItems,
    lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
  }, { merge: true });
}

function listenToCloud() {
  const statusEl = document.getElementById('syncStatus');
  if (!planDocRef) {
    statusEl.textContent = 'Mode: Offline Local Storage (Add Firebase keys to enable sync)';
    statusEl.style.color = '#555';
    statusEl.style.background = '#eee';
    selections = JSON.parse(localStorage.getItem('wongler_meal_selections')) || {};
    checkedItems = JSON.parse(localStorage.getItem('wongler_checked_items')) || {};
    customItems = JSON.parse(localStorage.getItem('wongler_custom_items')) || [];
    renderDays();
    updateGroceryList();
    return;
  }

  planDocRef.onSnapshot(doc => {
    statusEl.textContent = 'Cloud Sync: Active (Connected to Firestore)';
    statusEl.style.color = '#2e7d32';
    statusEl.style.background = '#e8f5e9';

    if (doc.exists) {
      const data = doc.data();
      selections = data.selections || {};
      checkedItems = data.checkedItems || {};
      customItems = data.customItems || [];
    } else {
      selections = {};
      checkedItems = {};
      customItems = [];
    }
    renderDays();
    updateGroceryList();
  }, err => {
    console.error("Firestore error:", err);
    statusEl.textContent = 'Cloud Sync: Connection Error (Check rules/keys)';
    statusEl.style.color = '#c62828';
    statusEl.style.background = '#ffebee';
  });
}

function onMealChange(key, value) {
  selections[key] = value;
  syncToCloud();
  updateGroceryList();
}

// ==========================================
// 5. CUSTOM EXTRA ITEM HANDLER
// ==========================================
document.getElementById('addCustomBtn').addEventListener('click', addCustomItem);
document.getElementById('customItemInput').addEventListener('keyup', e => {
  if (e.key === 'Enter') addCustomItem();
});

function addCustomItem() {
  const input = document.getElementById('customItemInput');
  const itemName = input.value.trim();
  if (!itemName) return;

  // Selected store checkboxes
  const storeCheckboxes = document.querySelectorAll('input[name="customStore"]:checked');
  const chosenStores = Array.from(storeCheckboxes).map(cb => cb.value);

  customItems.push({
    id: 'cust_' + Date.now(),
    name: itemName,
    stores: chosenStores
  });

  input.value = '';
  storeCheckboxes.forEach(cb => cb.checked = false);

  syncToCloud();
  updateGroceryList();
}

function deleteCustomItem(id) {
  customItems = customItems.filter(item => item.id !== id);
  delete checkedItems[id];
  syncToCloud();
  updateGroceryList();
}

// ==========================================
// 6. GROCERY LIST GENERATOR
// ==========================================
function updateGroceryList() {
  const container = document.getElementById('groceryListContainer');
  const activeStore = document.getElementById('storeFilter').value;
  container.innerHTML = '';

  const neededIngredientKeys = new Set();
  const rawKeyMap = {};

  DAYS.forEach(day => {
    ['lunch', 'dinner'].forEach(mealType => {
      const mealId = selections[`${day}_${mealType}`];
      if (!mealId) return;
      const meal = mealsData.find(m => m.meal_id === mealId);
      if (meal && meal.ingredients) {
        meal.ingredients.split(',').forEach(item => {
          const trimmed = item.trim();
          if (trimmed) {
            const key = trimmed.toLowerCase();
            neededIngredientKeys.add(key);
            if (!rawKeyMap[key]) rawKeyMap[key] = trimmed;
          }
        });
      }
    });
  });

  if (neededIngredientKeys.size === 0 && customItems.length === 0) {
    container.innerHTML = '<li class="empty-state">No items yet. Choose meals above or add extra grocery items.</li>';
    return;
  }

  let displayedCount = 0;

  // Render Meal Ingredients
  const sortedKeys = Array.from(neededIngredientKeys).sort((a, b) => {
    const nameA = (ingredientsMap[a] ? ingredientsMap[a].displayName : rawKeyMap[a]).toLowerCase();
    const nameB = (ingredientsMap[b] ? ingredientsMap[b].displayName : rawKeyMap[b]).toLowerCase();
    return nameA.localeCompare(nameB);
  });

  sortedKeys.forEach(key => {
    const itemData = ingredientsMap[key] || { displayName: rawKeyMap[key], stores: [] };
    const stores = itemData.stores;
    const displayName = itemData.displayName;

    if (activeStore !== 'ALL' && !stores.includes(activeStore)) {
      return;
    }

    displayedCount++;
    const isChecked = !!checkedItems[key];
    const li = document.createElement('li');
    li.className = `grocery-item ${isChecked ? 'checked' : ''}`;

    const label = document.createElement('label');
    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.checked = isChecked;
    checkbox.addEventListener('change', () => {
      checkedItems[key] = checkbox.checked;
      syncToCloud();
      li.classList.toggle('checked', checkbox.checked);
    });

    label.appendChild(checkbox);
    label.appendChild(document.createTextNode(displayName));

    const rightContainer = document.createElement('div');
    if (activeStore === 'ALL' && stores.length > 0) {
      stores.forEach(s => {
        const badge = document.createElement('span');
        badge.className = 'store-badge';
        badge.textContent = s;
        rightContainer.appendChild(badge);
      });
    }

    li.appendChild(label);
    li.appendChild(rightContainer);
    container.appendChild(li);
  });

  // Render Custom Added Items
  customItems.forEach(item => {
    // If a store is filtered, show only if tagged for this store, OR if no stores were specified (wildcard)
    if (activeStore !== 'ALL' && item.stores.length > 0 && !item.stores.includes(activeStore)) {
      return;
    }

    displayedCount++;
    const isChecked = !!checkedItems[item.id];
    const li = document.createElement('li');
    li.className = `grocery-item ${isChecked ? 'checked' : ''}`;

    const label = document.createElement('label');
    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.checked = isChecked;
    checkbox.addEventListener('change', () => {
      checkedItems[item.id] = checkbox.checked;
      syncToCloud();
      li.classList.toggle('checked', checkbox.checked);
    });

    label.appendChild(checkbox);
    label.appendChild(document.createTextNode(item.name));

    const rightContainer = document.createElement('div');
    rightContainer.style.display = 'flex';
    rightContainer.style.alignItems = 'center';

    if (activeStore === 'ALL' && item.stores.length > 0) {
      item.stores.forEach(s => {
        const badge = document.createElement('span');
        badge.className = 'store-badge';
        badge.textContent = s;
        rightContainer.appendChild(badge);
      });
    }

    const delBtn = document.createElement('button');
    delBtn.className = 'delete-btn';
    delBtn.title = 'Remove item';
    delBtn.innerHTML = '&times;';
    delBtn.addEventListener('click', () => deleteCustomItem(item.id));
    rightContainer.appendChild(delBtn);

    li.appendChild(label);
    li.appendChild(rightContainer);
    container.appendChild(li);
  });

  if (displayedCount === 0) {
    container.innerHTML = `<li class="empty-state">No ingredients or extra items are tagged for <strong>${activeStore}</strong>.</li>`;
  }
}

// Reset Handlers
document.getElementById('storeFilter').addEventListener('change', updateGroceryList);

document.getElementById('clearChecksBtn').addEventListener('click', () => {
  checkedItems = {};
  syncToCloud();
  updateGroceryList();
});

document.getElementById('resetWeekBtn').addEventListener('click', () => {
  if (confirm('Reset meal selections for Monday–Friday? (Custom grocery items will be kept)')) {
    selections = {};
    checkedItems = {};
    syncToCloud();
    renderDays();
    updateGroceryList();
  }
});

// App Startup
checkAuth();
initData();
listenToCloud();
</script>

</body>
</html>
