<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Household Hub</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">

    <!-- Simple Login Modal -->
    <div id="auth-modal" class="fixed inset-0 bg-slate-900/50 flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-xl shadow-xl w-80">
            <h2 class="text-xl font-bold mb-2">Household Access</h2>
            <p class="text-sm text-slate-600 mb-4">Enter your name and the shared household password.</p>
            <input type="text" id="user-name" placeholder="Your Name (e.g., Dad, Babysitter)" class="w-full border rounded-lg p-2 mb-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            <input type="password" id="shared-password" placeholder="Shared Password" class="w-full border rounded-lg p-2 mb-4 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button onclick="handleLogin()" class="w-full bg-blue-600 text-white py-2 rounded-lg font-medium hover:bg-blue-700 transition">Enter Hub</button>
            <p id="login-error" class="text-red-500 text-xs mt-2 hidden">Incorrect password.</p>
        </div>
    </div>

    <!-- Main Content Container -->
    <div class="max-w-6xl mx-auto p-4 md:p-8 hidden" id="main-content">
        <header class="flex justify-between items-center mb-8 border-b pb-4">
            <div>
                <h1 class="text-2xl font-bold text-slate-900">🏠 Household Hub</h1>
                <p class="text-sm text-slate-500">Logged in as: <span id="current-user-display" class="font-semibold text-slate-700"></span></p>
            </div>
            <button onclick="logout()" class="text-sm text-red-600 hover:underline font-medium">Log out</button>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- Meal Planner Section -->
            <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
                <h2 class="text-lg font-bold mb-4 text-slate-800 flex items-center gap-2">📅 Weekday Meal Planner</h2>
                <div id="meal-list" class="space-y-4">
                    <!-- Injected via JavaScript -->
                </div>
            </section>

            <!-- Grocery List Section -->
            <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
                <h2 class="text-lg font-bold mb-4 text-slate-800 flex items-center gap-2">🛒 Grocery List</h2>
                
                <!-- Add Custom Item Form -->
                <form onsubmit="addCustomGrocery(event)" class="flex gap-2 mb-6">
                    <input type="text" id="grocery-name-input" placeholder="Add item..." required class="flex-1 border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    <select id="grocery-store-input" class="border rounded-lg px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500">
                        <option value="Harris Teeter">Harris Teeter</option>
                        <option value="Whole Foods">Whole Foods</option>
                        <option value="Trader Joe's">Trader Joe's</option>
                        <option value="Sam's Club">Sam's Club</option>
                        <option value="Other">Other</option>
                    </select>
                    <button type="submit" class="bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-emerald-700 transition">Add</button>
                </form>

                <!-- Grouped Store List -->
                <div id="grocery-display" class="space-y-6">
                    <!-- Injected via JavaScript -->
                </div>
            </section>
        </div>
    </div>

    <script>
        // Configuration
        const SHARED_PASSWORD = 'ourhousepassword'; // Change to whatever shared password you prefer
        const DAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];
        
        const LUNCH_OPTIONS = ['Leftovers', 'Turkey Wrap', 'PB&J', 'Mac & Cheese', 'Salad', 'Soup'];
        
        // Dinners with mapped automatic grocery ingredients
        const DINNER_RECIPES = {
            'Chicken & Veggies': [{ name: 'Chicken Breast', store: 'Harris Teeter' }, { name: 'Broccoli', store: 'Whole Foods' }, { name: 'Olive Oil', store: 'Trader Joe\'s' }],
            'Tacos': [{ name: 'Ground Beef', store: 'Harris Teeter' }, { name: 'Tortillas', store: 'Trader Joe\'s' }, { name: 'Cheddar Cheese', store: 'Sam\'s Club' }, { name: 'Salsa', store: 'Trader Joe\'s' }],
            'Pasta Bolognese': [{ name: 'Ground Beef', store: 'Harris Teeter' }, { name: 'Pasta', store: 'Trader Joe\'s' }, { name: 'Marinara Sauce', store: 'Whole Foods' }],
            'Salmon & Rice': [{ name: 'Salmon Fillets', store: 'Whole Foods' }, { name: 'Jasmine Rice', store: 'Sam\'s Club' }, { name: 'Asparagus', store: 'Harris Teeter' }],
            'Stir Fry': [{ name: 'Chicken Breast', store: 'Harris Teeter' }, { name: 'Mixed Veggies', store: 'Trader Joe\'s' }, { name: 'Soy Sauce', store: 'Other' }],
            'Pizza Night': [{ name: 'Pizza Dough', store: 'Trader Joe\'s' }, { name: 'Mozzarella', store: 'Harris Teeter' }, { name: 'Pepperoni', store: 'Sam\'s Club' }]
        };

        // Initialize state from LocalStorage or defaults
        let meals = JSON.parse(localStorage.getItem('hh_meals')) || {};
        let groceries = JSON.parse(localStorage.getItem('hh_groceries')) || [
            { id: 1, name: 'Milk', store: 'Harris Teeter', purchased: false, source: 'manual' },
            { id: 2, name: 'Eggs', store: 'Sam\'s Club', purchased: false, source: 'manual' }
        ];

        function handleLogin() {
            const name = document.getElementById('user-name').value.trim();
            const pass = document.getElementById('shared-password').value;

            if (pass !== SHARED_PASSWORD) {
                document.getElementById('login-error').classList.remove('hidden');
                return;
            }
            if (!name) {
                alert('Please enter your name.');
                return;
            }

            localStorage.setItem('hh_user', name);
            initApp(name);
        }

        function logout() {
            localStorage.removeItem('hh_user');
            location.reload();
        }

        window.onload = () => {
            const savedUser = localStorage.getItem('hh_user');
            if (savedUser) {
                initApp(savedUser);
            }
        };

        function initApp(username) {
            document.getElementById('current-user-display').innerText = username;
            document.getElementById('auth-modal').classList.add('hidden');
            document.getElementById('main-content').classList.remove('hidden');
            renderMealPlanner();
            renderGroceries();
        }

        // --- MEALS LOGIC ---
        function renderMealPlanner() {
            const container = document.getElementById('meal-list');
            container.innerHTML = DAYS.map(day => `
                <div class="p-3 bg-slate-50 rounded-lg border border-slate-200">
                    <span class="font-semibold text-slate-700 block mb-2">${day}</span>
                    <div class="grid grid-cols-2 gap-2 text-sm">
                        <div>
                            <label class="text-xs text-slate-500 block mb-1">Lunch</label>
                            <select id="lunch-${day}" onchange="updateMeal('${day}', 'lunch')" class="w-full border rounded p-1.5 bg-white focus:outline-none">
                                <option value="">Select lunch...</option>
                                ${LUNCH_OPTIONS.map(opt => `<option value="${opt}" ${meals[day]?.lunch === opt ? 'selected' : ''}>${opt}</option>`).join('')}
                            </select>
                        </div>
                        <div>
                            <label class="text-xs text-slate-500 block mb-1">Dinner</label>
                            <select id="dinner-${day}" onchange="updateMeal('${day}', 'dinner')" class="w-full border rounded p-1.5 bg-white focus:outline-none">
                                <option value="">Select dinner...</option>
                                ${Object.keys(DINNER_RECIPES).map(opt => `<option value="${opt}" ${meals[day]?.dinner === opt ? 'selected' : ''}>${opt}</option>`).join('')}
                            </select>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function updateMeal(day, type) {
            const lunchVal = document.getElementById(`lunch-${day}`).value;
            const dinnerVal = document.getElementById(`dinner-${day}`).value;

            const oldDinner = meals[day]?.dinner;

            if (!meals[day]) meals[day] = {};
            meals[day].lunch = lunchVal;
            meals[day].dinner = dinnerVal;

            // If dinner changed, handle auto-grocery population/removal
            if (oldDinner !== dinnerVal) {
                // Remove previous auto-added items for this day/dinner if they aren't manually added elsewhere
                groceries = groceries.filter(item => item.source !== `${day}-dinner`);

                // Add new ingredients if recipe exists
                if (dinnerVal && DINNER_RECIPES[dinnerVal]) {
                    DINNER_RECIPES[dinnerVal].forEach(ing => {
                        groceries.push({
                            id: Date.now() + Math.random(),
                            name: ing.name,
                            store: ing.store,
                            purchased: false,
                            source: `${day}-dinner`
                        });
                    });
                }
            }

            localStorage.setItem('hh_meals', JSON.stringify(meals));
            localStorage.setItem('hh_groceries', JSON.stringify(groceries));
            renderGroceries();
        }

        // --- GROCERY LOGIC ---
        function addCustomGrocery(e) {
            e.preventDefault();
            const nameInput = document.getElementById('grocery-name-input');
            const storeInput = document.getElementById('grocery-store-input');

            groceries.push({
                id: Date.now(),
                name: nameInput.value.trim(),
                store: storeInput.value,
                purchased: false,
                source: 'manual'
            });

            nameInput.value = '';
            localStorage.setItem('hh_groceries', JSON.stringify(groceries));
            renderGroceries();
        }

        function togglePurchased(id) {
            const item = groceries.find(i => i.id === id);
            if (item) {
                item.purchased = !item.purchased;
                localStorage.setItem('hh_groceries', JSON.stringify(groceries));
                renderGroceries();
            }
        }

        function deleteGrocery(id) {
            groceries = groceries.filter(i => i.id !== id);
            localStorage.setItem('hh_groceries', JSON.stringify(groceries));
            renderGroceries();
        }

        function renderGroceries() {
            const container = document.getElementById('grocery-display');

            // Group by store
            const grouped = groceries.reduce((acc, item) => {
                const store = item.store || 'Other';
                if (!acc[store]) acc[store] = [];
                acc[store].push(item);
                return acc;
            }, {});

            if (groceries.length === 0) {
                container.innerHTML = `<p class="text-sm text-slate-400 italic text-center py-4">Your grocery list is empty.</p>`;
                return;
            }

            container.innerHTML = Object.entries(grouped).map(([store, items]) => `
                <div class="border rounded-lg p-3 bg-slate-50">
                    <h3 class="font-bold text-slate-700 text-sm mb-2 flex justify-between items-center">
                        <span>📍 ${store}</span>
                        <span class="text-xs bg-slate-200 text-slate-600 px-2 py-0.5 rounded-full">${items.filter(i => !i.purchased).length} left</span>
                    </h3>
                    <ul class="space-y-1.5">
                        ${items.map(item => `
                            <li class="flex items-center justify-between text-sm bg-white p-2 rounded border border-slate-100 shadow-xs">
                                <label class="flex items-center gap-2 cursor-pointer ${item.purchased ? 'line-through text-slate-400' : 'text-slate-700'}">
                                    <input type="checkbox" ${item.purchased ? 'checked' : ''} onchange="togglePurchased(${item.id})" class="rounded text-blue-600 focus:ring-0">
                                    <span>${item.name}</span>
                                </label>
                                <button onclick="deleteGrocery(${item.id})" class="text-slate-400 hover:text-red-500 text-xs px-1 font-bold">✕</button>
                            </li>
                        `).join('')}
                    </ul>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
